<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CB 可轉債分析平台</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- 頂部導覽 -->
  <header class="header">
    <div class="header-title">
      <div class="logo">CB</div>
      <span>可轉債分析平台</span>
    </div>
    <div class="header-tabs">
      <button class="header-tab active" id="tab-cb" onclick="App.switchTab('cb')">CB 分析</button>
      <button class="header-tab" id="tab-etf" onclick="App.switchTab('etf')">ETF 持股</button>
      <button class="header-tab" id="tab-vcp" onclick="App.switchTab('vcp')">VCP 選股</button>
      <!-- 強勢股分頁暫時封存 (2026-08-14):相關程式碼 js/strengthView.js / data/strength.json 皆保留,
           要復原只需把下面這行取消註解 (switchTab 的 'strength' 分支仍在)。 -->
      <!-- <button class="header-tab" id="tab-strength" onclick="App.switchTab('strength')">強勢股</button> -->
      <button class="header-tab" id="tab-calendar" onclick="App.switchTab('calendar')">CB 日曆</button>
      <button class="header-tab" id="tab-reports" onclick="App.switchTab('reports')">報告清單</button>
    </div>
    <div class="header-actions">
      <span class="header-date" id="header-date"></span>
      <span class="header-status" id="header-status"></span>
      <button class="btn-icon mobile-filter-toggle" onclick="App.toggleMobileFilter()" title="篩選">&#x2630;</button>
      <button class="btn-icon" onclick="App.refreshData()" title="重新載入資料">&#x21BB;</button>
    </div>
  </header>

  <!-- 主版面 -->
  <div class="main-layout">
    <!-- 左側篩選面板 -->
    <aside class="sidebar" id="filter-panel">
      <!-- 由 JS 動態產生 -->
    </aside>

    <!-- 主內容區 -->
    <main class="content">
      <div id="main-table">
        <!-- 由 JS 動態產生 -->
      </div>
    </main>
  </div>

  <!-- 右側詳情面板 -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <div class="detail-title" id="detail-title"></div>
      <button class="detail-close" onclick="App.closeDetail()">&times;</button>
    </div>

    <!-- 1. 股價資訊 -->
    <div class="detail-section">
      <div class="detail-section-head">
        <h3>股價資訊</h3>
        <button class="btn-tech-analysis" type="button" onclick="App.openTechModal()" title="個股技術分析 (K線 / 法人 / 融資券)">個股技術分析</button>
        <button class="btn-tech-analysis" type="button" onclick="App.openInvestModal()" title="簡易報告 (投資重點一頁式)">簡易報告</button>
        <button class="btn-tech-analysis btn-icon-only" type="button" onclick="App.openCompanyReportModal()" title="企業報告 (Drive 簡易報告 PNG + 完整 PDF)">📄</button>
      </div>
      <div id="detail-price-info"></div>
    </div>

    <!-- 4. CB 資訊 -->
    <div class="detail-section">
      <div class="detail-section-head">
        <h3>CB 可轉債資訊</h3>
        <button class="btn-tech-analysis" type="button" onclick="App.openCBTechModal()" title="CB 技術分析">CB 技術分析</button>
      </div>
      <div id="detail-cb-info"></div>
    </div>

    <!-- 7. 新聞資訊 -->
    <div class="detail-section">
      <h3>新聞資訊</h3>
      <div id="detail-news-info"></div>
    </div>

  </div>

  <!-- 技術分析 Modal -->
  <div class="auction-modal" id="tech-modal" onclick="App.closeTechModal(event)">
    <div class="auction-modal-content tech-modal-content" onclick="event.stopPropagation()">
      <div class="auction-modal-header">
        <div class="tech-quota-group" id="tech-quota-group-stock">
          <label><input type="checkbox" data-quota="unified"><span>統一額度</span></label>
          <label><input type="checkbox" data-quota="fubon"><span>富邦額度</span></label>
          <label><input type="checkbox" data-quota="yuanta"><span>元大額度</span></label>
        </div>
        <div class="auction-modal-title" id="tech-modal-title"></div>
        <span class="tech-days-badge" id="tech-days-badge" title="滑鼠滾輪可調整時間範圍 (20~240 日)">60 日</span>
        <button class="btn-tech-analysis btn-header-link" type="button" onclick="App.openCBTechFromStock()" title="併排顯示 CB 技術分析">CB 技術分析</button>
        <button class="detail-close" onclick="App.closeTechModal()">&times;</button>
      </div>
      <div class="auction-modal-body tech-modal-body tech-modal-body-v2">
        <!-- 第一欄: K 線 / 量能 -->
        <div class="tech-section-kline">
          <div class="tech-chart-head">
            <span class="tech-chart-title">K 線 / 量能</span>
            <span class="tech-legend">
              <span class="legend-chip" style="--c:#f59e0b">MA5</span>
              <span class="legend-chip" style="--c:#3b82f6">MA10</span>
              <span class="legend-chip" style="--c:#a855f7">MA20</span>
              <span class="legend-chip" style="--c:#10b981">MA55</span>
              <span class="legend-chip" style="--c:rgba(34,197,94,0.7)">成交量</span>
            </span>
          </div>
          <div class="chart-container tech-chart-container">
            <canvas id="tech-price-chart"></canvas>
          </div>
        </div>

        <!-- 第二欄: 2 個檔案夾 tab -->
        <div class="tech-section-tabs">
          <div class="tech-folder-tabs">
            <button class="tech-folder-tab active" data-folder="inst">法人買賣</button>
            <button class="tech-folder-tab" data-folder="margin">資券</button>
          </div>

          <!-- Panel A: 法人買賣 (外資 / 投信 / 自營商) -->
          <div class="tech-folder-panel" data-panel="inst">
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">外資</span>
                <span class="tech-chart-meta" id="tech-foreign-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="tech-foreign-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">投信</span>
                <span class="tech-chart-meta" id="tech-invest-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="tech-invest-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">自營商</span>
                <span class="tech-chart-meta" id="tech-dealer-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="tech-dealer-chart"></canvas>
              </div>
            </div>
          </div>

          <!-- Panel B: 資券 (乖離率 / 融資 / 融券) -->
          <div class="tech-folder-panel hidden" data-panel="margin">
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">乖離率
                  <span class="tech-legend">
                    <span class="legend-chip" style="--c:#f59e0b">5</span>
                    <span class="legend-chip" style="--c:#3b82f6">10</span>
                    <span class="legend-chip" style="--c:#a855f7">20</span>
                  </span>
                </span>
                <span class="tech-chart-meta" id="tech-bias-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="tech-bias-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">融資</span>
                <span class="tech-chart-meta" id="tech-margin-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="tech-margin-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">融券</span>
                <span class="tech-chart-meta" id="tech-short-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="tech-short-chart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CB 技術分析 Modal -->
  <div class="auction-modal" id="cbtech-modal" onclick="App.closeCBTechModal(event)">
    <div class="auction-modal-content tech-modal-content" onclick="event.stopPropagation()">
      <div class="auction-modal-header">
        <div class="tech-quota-group" id="tech-quota-group-cb">
          <label><input type="checkbox" data-quota="unified"><span>統一額度</span></label>
          <label><input type="checkbox" data-quota="fubon"><span>富邦額度</span></label>
          <label><input type="checkbox" data-quota="yuanta"><span>元大額度</span></label>
        </div>
        <div class="auction-modal-title" id="cbtech-modal-title"></div>
        <span class="tech-days-badge" id="cbtech-days-badge" title="滑鼠滾輪可調整時間範圍 (20~240 日)">60 日</span>
        <button class="btn-tech-analysis btn-header-link" type="button" onclick="App.openTechFromCB()" title="併排顯示個股技術分析">個股技術分析</button>
        <button class="detail-close" onclick="App.closeCBTechModal()">&times;</button>
      </div>
      <div class="auction-modal-body tech-modal-body tech-modal-body-v2">
        <!-- 第一欄: CB K 線 -->
        <div class="tech-section-kline">
          <div class="tech-chart-head">
            <span class="tech-chart-title">CB K 線 / 量能</span>
            <span class="tech-legend">
              <span class="legend-chip" style="--c:#f59e0b">MA5</span>
              <span class="legend-chip" style="--c:#3b82f6">MA10</span>
              <span class="legend-chip" style="--c:#a855f7">MA20</span>
              <span class="legend-chip" style="--c:#10b981">MA55</span>
              <span class="legend-chip" style="--c:rgba(34,197,94,0.7)">成交量</span>
            </span>
            <span class="tech-chart-meta" id="cbtech-price-meta"></span>
          </div>
          <div class="chart-container tech-chart-container">
            <canvas id="cbtech-price-chart"></canvas>
          </div>
        </div>

        <!-- 第二欄: 2 個檔案夾 tab -->
        <div class="tech-section-tabs">
          <div class="tech-folder-tabs">
            <button class="tech-folder-tab active" data-folder="inst">法人買賣</button>
            <button class="tech-folder-tab" data-folder="extra">溢價/餘額</button>
          </div>

          <!-- Panel A: CB 法人買賣 -->
          <div class="tech-folder-panel" data-panel="inst">
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">外資</span>
                <span class="tech-chart-meta" id="cbtech-foreign-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="cbtech-foreign-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">投信</span>
                <span class="tech-chart-meta" id="cbtech-invest-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="cbtech-invest-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">自營商</span>
                <span class="tech-chart-meta" id="cbtech-dealer-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="cbtech-dealer-chart"></canvas>
              </div>
            </div>
          </div>

          <!-- Panel B: 溢價 / 餘額 -->
          <div class="tech-folder-panel hidden" data-panel="extra">
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">CB 溢價率</span>
                <span class="tech-chart-meta" id="cbtech-premium-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="cbtech-premium-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">流通餘額</span>
                <span class="tech-chart-meta" id="cbtech-balance-meta"></span>
              </div>
              <div class="chart-container tech-chart-container">
                <canvas id="cbtech-balance-chart"></canvas>
              </div>
            </div>
            <div class="tech-chart-sub">
              <div class="tech-sub-head">
                <span class="tech-sub-title">(保留)</span>
              </div>
              <div class="chart-container tech-chart-container"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CB 開標統計表 Modal -->
  <div class="auction-modal" id="auction-modal" onclick="App.closeAuctionModal(event)">
    <div class="auction-modal-content auc-modal-content" onclick="event.stopPropagation()">
      <div class="auction-modal-header">
        <div class="auction-modal-title" id="auction-modal-title"></div>
        <div class="auc-nav">
          <button class="auc-nav-btn" id="auc-nav-prev" title="上一檔 (←)"
                  onclick="App.stepAuction(-1)">&#9664;</button>
          <span class="auc-nav-pos" id="auc-nav-pos">–</span>
          <button class="auc-nav-btn" id="auc-nav-next" title="下一檔 (→)"
                  onclick="App.stepAuction(1)">&#9654;</button>
        </div>
        <div class="auc-pagetabs">
          <button class="auc-pagetab active" id="auc-tab-summary"
                  onclick="AuctionView.switchPage('summary')">開標全覽</button>
          <button class="auc-pagetab" id="auc-tab-timeline"
                  onclick="AuctionView.switchPage('timeline')">發行事件軸</button>
        </div>
        <button class="detail-close" onclick="App.closeAuctionModal()">&times;</button>
      </div>
      <div class="auction-modal-body auc-modal-body" id="auction-modal-body"></div>
    </div>
  </div>

  <!-- VCP 收斂圖 Modal -->
  <div class="auction-modal" id="vcp-modal" onclick="VCPView.closeModal(event)">
    <div class="auction-modal-content tech-modal-content" onclick="event.stopPropagation()">
      <div class="auction-modal-header">
        <div class="auction-modal-title" id="vcp-modal-title"></div>
        <span class="tech-legend">
          <span class="legend-chip" style="--c:#f59e0b">MA5</span>
          <span class="legend-chip" style="--c:#3b82f6">MA10</span>
          <span class="legend-chip" style="--c:#a855f7">MA20</span>
          <span class="legend-chip" style="--c:#fbbf24">Pivot</span>
        </span>
        <button class="detail-close" onclick="VCPView.closeModal()">&times;</button>
      </div>
      <div class="auction-modal-body vcp-modal-body">
        <div class="chart-container vcp-chart-container">
          <canvas id="vcp-price-chart"></canvas>
        </div>
        <div id="vcp-modal-info" class="vcp-modal-info"></div>
      </div>
    </div>
  </div>

  <!-- 強勢股 K 線 Modal -->
  <div class="auction-modal" id="strength-modal" onclick="StrengthView.closeModal(event)">
    <div class="auction-modal-content tech-modal-content" onclick="event.stopPropagation()">
      <div class="auction-modal-header">
        <div class="auction-modal-title" id="strength-modal-title"></div>
        <span class="tech-legend">
          <span class="legend-chip" style="--c:#f59e0b">MA5</span>
          <span class="legend-chip" style="--c:#a855f7">MA20</span>
          <span class="legend-chip" style="--c:#3b82f6">MA60</span>
          <span class="legend-chip" style="--c:#22d3ee">52週高</span>
        </span>
        <button class="detail-close" onclick="StrengthView.closeModal()">&times;</button>
      </div>
      <div class="auction-modal-body vcp-modal-body">
        <div class="chart-container vcp-chart-container">
          <canvas id="strength-price-chart"></canvas>
        </div>
        <div id="strength-modal-info" class="vcp-modal-info"></div>
      </div>
    </div>
  </div>

  <!-- 投資重點儀表板 Modal -->
  <div class="auction-modal" id="invest-modal" onclick="App.closeInvestModal(event)">
    <div class="auction-modal-content tech-modal-content" onclick="event.stopPropagation()">
      <div class="auction-modal-header">
        <div class="auction-modal-title" id="invest-modal-title"></div>
        <button class="detail-close" onclick="App.closeInvestModal()">&times;</button>
      </div>
      <div class="auction-modal-body invest-modal-body" id="invest-modal-body"></div>
    </div>
  </div>

  <!-- 企業報告 (Drive 簡易報告 PNG + 完整 PDF) Modal -->
  <div class="auction-modal" id="company-report-modal" onclick="App.closeCompanyReportModal(event)">
    <div class="auction-modal-content tech-modal-content" onclick="event.stopPropagation()">
      <div class="auction-modal-header">
        <div class="auction-modal-title" id="company-report-modal-title"></div>
        <button class="btn-tech-analysis" type="button" id="company-report-pdf-btn" title="開啟完整 PDF 報告">📕 完整報告 PDF</button>
        <button class="detail-close" onclick="App.closeCompanyReportModal()">&times;</button>
      </div>
      <div class="auction-modal-body company-report-modal-body" id="company-report-modal-body"></div>
    </div>
  </div>

  <!-- 手機篩選遮罩 -->
  <div class="mobile-filter-backdrop" id="mobile-filter-backdrop" onclick="App.toggleMobileFilter()"></div>

  <!-- 載入畫面 -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">正在載入資料...</div>
  </div>

  <!-- 載入 JS 模組 (順序重要) -->
  <script src="js/config.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/public-watchlist.js"></script>
  <script src="js/sheetsApi.js"></script>
  <script src="js/dataProcessor.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/table.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/exportCsv.js"></script>
  <script src="js/etfView.js"></script>
  <script src="js/vcpView.js"></script>
  <script src="js/strengthView.js"></script>
  <script src="js/auctionView.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/reportsView.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
