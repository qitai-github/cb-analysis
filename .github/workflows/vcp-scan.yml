name: VCP Scan (VCP 選股)

# 全台股 VCP (Volatility Contraction Pattern) 掃描 → data/vcp.json。
# 與 strength-scan.yml 共用同一份全市場快取 (scripts/cache/universe/),
# 但獨立成一支 workflow → 故障隔離 (VCP 掛掉不影響強勢股更新, 反之亦然)。
#
# 流程:
#   1. actions/cache 還原全市場 OHLCV 快取 (與強勢股共用 universe-cache-* key 前綴)
#   2. build_universe.py --refresh-latest  → 增量抓 Drive 當天最新交易日
#   3. vcp_scanner.py --no-excel            → 產 data/vcp.json
#   4. commit + push → 觸發 GH Pages rebuild
#
# 排程 19:35 TPE = 11:35 UTC, 週一~五 (比強勢股 19:40 早 5 分, 錯開 Drive 存取)。
#   資料來源 STOCK_PRICE_TWSE/TPEX 由 fetch-stocks.yml 於 18:23 TPE 寫進 Drive。
#
# 快取: key 帶 run_id 每次存新快取, restore-keys 前綴還原最近一份 (與強勢股共享池)。
#   cache miss 時 build_universe.py 會自動全量重建 (無狀態 fallback)。

on:
  schedule:
    - cron: '35 11 * * 1-5'
  workflow_dispatch:
    inputs:
      as_of:
        description: '指定 as-of 日期 YYYYMMDD (空白 = 快取最新交易日)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: vcp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-stocks.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-stocks.txt

      - name: Restore universe cache
        uses: actions/cache@v4
        with:
          path: scripts/cache/universe
          key: universe-cache-${{ github.run_id }}
          restore-keys: |
            universe-cache-

      - name: Build universe (增量抓 Drive 最新交易日)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRIVE_FOLDERS: ${{ secrets.DRIVE_FOLDERS }}
        run: python scripts/build_universe.py --refresh-latest

      - name: Run VCP scanner
        run: |
          ARGS="--no-excel"
          if [ -n "${{ inputs.as_of }}" ]; then
            ARGS="$ARGS ${{ inputs.as_of }}"
          fi
          python scripts/vcp_scanner.py $ARGS

      - name: Commit & push data/vcp.json
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vcp.json
          if git diff --cached --quiet; then
            echo "no vcp.json changes"
            exit 0
          fi
          git commit -m "Update data/vcp.json @ $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed,rebase 後重試..."
            git pull --rebase --autostash
          done
          echo "push failed after 3 retries"
          exit 1
