name: Fetch Stocks Backup
# 排程已移到 GAS (GoogleAppScript/GitHubCloudSchedule.gs.txt),此檔無 cron,僅 workflow_dispatch。

# GAS 主路徑之外的備援。由 GAS GitHubCloudSchedule 在 TWSE 當日行情公布後(17:00 起)派送,把 6 個 CSV 抓網頁覆蓋到 Drive。
# 前提: GAS CreatePlaceholders.gs 已每日 00:30 預建 8 個空檔
#       (SA 只能覆蓋既存檔,不能建新檔 - storage quota 限制)。
# 觸發順序(main pipeline): fetch-stocks → parse-and-export → vcp-scan → sync-board-watchlist,
# 每步等前一步成功才派送。
#
# 注意: 融資融券 (MARGIN_TWSE/TPEX) 排除在此 workflow 之外!
#       TWSE/TPEX 融資融券通常 21:00 後才公布,傍晚抓會拿到舊資料或失敗,
#       改由 margin-late.yml 在 21:10 後單獨抓 (GAS margin pipeline)。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '特定日期 YYYYMMDD (空白則抓今天 Asia/Taipei)'
        required: false
        default: ''
      sources:
        description: '只跑指定來源 (逗號分隔);空白 = 跑 6 個(排除融資融券)'
        required: false
        default: ''

# 避免 GAS 派送與手動觸發重疊重複抓取
concurrency:
  group: fetch-stocks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-stocks.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-stocks.txt

      - name: Run fetcher
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRIVE_FOLDERS: ${{ secrets.DRIVE_FOLDERS }}
          FETCH_DATE: ${{ inputs.date }}
          # 手動 dispatch 沒填 sources → 跑 6 個 (排除融資融券,改由 margin-late.yml 跑)
          SOURCES: ${{ inputs.sources || 'STOCK_INST_TWSE,STOCK_INST_TPEX,STOCK_PRICE_TWSE,STOCK_PRICE_TPEX,CB_PRICE,CB_INST' }}
        run: python scripts/fetch_stocks.py
