name: TDCC Shareholding Weekly

# 集保股權分散表 (大戶明細) 每週更新。
#
# 分工 (為什麼要拆兩半):
#   - **GAS `TdccShareholding.gs`** 每週五晚上先在 Drive 建好**當天日期**的空檔
#     TDCC_OD_1-5_YYYYMMDD.csv (同 CreatePlaceholders.gs 的作法) —
#     Service Account 沒有 Drive 儲存配額,只能覆蓋/改名既存檔、不能建新檔。
#   - **這支 workflow** (週六早上) 抓 CSV → SA 覆蓋那個空檔 → 再用 repo 裡現有的
#     data/shareholding.json 當歷史基底做增量,commit 回 main。
#     空檔沒建成只會少一份 Drive 備份,不會擋掉 JSON 更新。
#
# 為什麼排週六早上:集保是**週五深夜~週六清晨**才發布當週(週五)那筆。
# 實測 2026-08-28(五) 20:44 去抓,拿到的還是 08/21 那筆;隔天清晨才變 08/28。
# 09:10 TPE 週六 = 01:10 UTC 週六 (避開 :00 整點的 GHA 排程高峰)。

on:
  schedule:
    - cron: '10 1 * * 6'
  workflow_dispatch:

# 同時只跑一個,避免兩次觸發同時 push 打架
concurrency:
  group: tdcc-shareholding
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-stocks.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-stocks.txt

      - name: Fetch TDCC + merge into data/shareholding.json
        env:
          # SA 用來覆蓋 GAS 預建的空檔;沒設就只更新 JSON、跳過 Drive 存檔
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/fetch_tdcc.py --cloud

      - name: Commit & push
        run: |
          if git diff --quiet -- data/shareholding.json; then
            echo "沒有變動 (可能集保還沒更新這週),跳過 commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shareholding.json
          git commit -m "data: 集保股權分散表 @ $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # main 每天有其他 workflow 在推 (all-data.json 等),先 rebase 再推
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push 失敗,重試 $i"
            sleep 10
          done
          exit 1
