name: Sector Flow (全市場產業資金流向)

# 全台股產業族群資金流向 → data/sector_flow.json。
#   價量來源: Drive 每日原始 CSV (STOCK_PRICE_TWSE/TPEX, fetch-stocks.yml 於 18:23 TPE 寫入)
#   分類來源: data/industry_classification.json (XQ 匯出,本機 scripts/export_xq_industry.py 產生後 commit)
#             + data/industry_chain.json (自訂族群/角色,本機 scripts/build_industry_chain.py 產生後 commit)
#   增量: 只抓比 sector_flow.json 最後一日新的交易日; 分類改變會自動全量重建。
#
# 每日自動更新已併入 parse-and-export.yml (同一個 commit);本檔只供手動全量重建 (rebuild=true)。
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: '全量重建視窗內所有交易日 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: sector-flow
  cancel-in-progress: false

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-stocks.txt

      - run: pip install -r scripts/requirements-stocks.txt

      - name: Build sector flow
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRIVE_FOLDERS: ${{ secrets.DRIVE_FOLDERS }}
        run: |
          ARGS=""
          if [ "${{ inputs.rebuild }}" = "true" ]; then ARGS="--rebuild"; fi
          python scripts/build_sector_flow.py $ARGS

      - name: Commit & push data/sector_flow.json
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sector_flow.json
          if git diff --cached --quiet; then
            echo "no sector_flow.json changes"
            exit 0
          fi
          git commit -m "Update data/sector_flow.json @ $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed,rebase 後重試..."
            git pull --rebase --autostash
          done
          echo "push failed after 3 retries"
          exit 1
